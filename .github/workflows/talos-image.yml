name: Talos Open Design image

on:
  push:
    branches: [main]
    paths:
      - 'apps/daemon/**'
      - 'apps/web/**'
      - 'deploy/Dockerfile'
      - 'deploy/configure-talos-local-agents.mjs'
      - 'deploy/talos-opencode-runtime.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/talos-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: talos-open-design-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/od
          tags: |
            type=raw,value=talos-main
            type=sha,prefix=talos-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_IMAGE=public.ecr.aws/docker/library/node:24-alpine
            RUNTIME_IMAGE=public.ecr.aws/docker/library/node:24-alpine
